# Generated: 2 GPU(s), fp32. Naming is uniform -- origami_train_multigpu.sh
# selects accelerate_config_<NUM_GPUS>gpu_<MIXED_PRECISION>.yaml with no
# special cases, so every (gpus, precision) pair resolves to the right file.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
gpu_ids: 0,1
machine_rank: 0
main_training_function: main
mixed_precision: 'no'
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
